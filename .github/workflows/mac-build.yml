# Test-Build der Mac-DMGs ohne Release. Baut die DMGs, hängt sie ein und prüft die
# Signatur der App darin. Die DMGs liegen danach als Artifact am Lauf, damit man sie vor
# einem Release auf einem echten Mac ausprobieren kann.
# Läuft von Hand (Actions › Mac-Build › „Run workflow“) und automatisch in Pull Requests,
# die Paketierung oder Signierung ändern. So fällt eine ungültige Signatur („App ist
# beschädigt“) auf, bevor ein Release sie verteilt.
name: Mac-Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/mac-*.js
      - build/**
      - .github/workflows/release.yml
      - .github/workflows/mac-build.yml

jobs:
  dmg:
    name: DMG ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-latest
            arch: arm64
          - name: Intel
            os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: DMG bauen
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Signatur in der eingehängten DMG prüfen
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          APP="$MNT/Netzwerkplaner.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee sig.txt | grep -E "Signature|Identifier|Sealed" || true
          grep -q "Signature=adhoc" sig.txt || { echo "::error::App ist nicht ad-hoc signiert"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee verify.txt
          grep -q "valid on disk" verify.txt && grep -q "satisfies its Designated Requirement" verify.txt \
            || { echo "::error::Signatur ungültig, macOS würde „beschädigt“ melden"; exit 1; }
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
