<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1c2127; overflow: hidden; -webkit-app-region: drag; user-select: none; }
    body { transition: opacity .25s ease; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border-bottom: 3px solid #f5a623; }
    .t { color: #f5a623; font-weight: 800; letter-spacing: 2px; font-size: 20px; }
    .s { color: #9aa4af; font-size: 11px; letter-spacing: .5px; }
    svg line { stroke: #3a424c; stroke-width: 2; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .9s ease forwards; }
    svg circle { fill: #252b33; stroke: #f5a623; stroke-width: 2; transform-origin: center; animation: pop .5s ease both; }
    svg circle.c { fill: #f5a623; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <svg width="140" height="80" viewBox="0 0 140 80">
    <line x1="70" y1="40" x2="20" y2="15"/><line x1="70" y1="40" x2="20" y2="65"/>
    <line x1="70" y1="40" x2="120" y2="15"/><line x1="70" y1="40" x2="120" y2="65"/><line x1="70" y1="40" x2="120" y2="40"/>
    <circle cx="20" cy="15" r="6" style="animation-delay:.3s"/><circle cx="20" cy="65" r="6" style="animation-delay:.4s"/>
    <circle cx="120" cy="15" r="6" style="animation-delay:.5s"/><circle cx="120" cy="40" r="6" style="animation-delay:.6s"/>
    <circle cx="120" cy="65" r="6" style="animation-delay:.7s"/><circle class="c" cx="70" cy="40" r="10"/>
  </svg>
  <div class="t">NETZWERKPLANER</div>
  <div class="s">Topologie · VLANs · IP-Plan</div>
</body>
</html>
